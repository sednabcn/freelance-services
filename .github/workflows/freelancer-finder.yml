name: Freelancer Opportunity Finder

on:
  schedule:
    # Run twice daily at 9 AM and 5 PM UTC
    - cron: '0 9,17 * * *'
  
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days back to search Gmail'
        required: true
        default: 7
        type: number
      
      keywords:
        description: 'Search keywords (comma-separated)'
        required: true
        default: 'python,automation,web scraping,api,machine learning'
        type: string
      
      skip_email:
        description: 'Skip sending notification email'
        required: false
        default: false
        type: boolean
      
      debug:
        description: 'Enable debug logging'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.10'

jobs:
  find-opportunities:
    name: Find Freelance Opportunities
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml feedparser
      
      # NEW: Test credentials before running main script
      - name: Test Gmail Connection
        run: |
          python3 << 'EOF'
          import imaplib
          import os
          import sys
          
          print("🔐 Testing Gmail authentication...")
          print(f"📧 Email: {os.getenv('FREELANCER_EMAIL', 'NOT SET')}")
          print(f"🔑 Password: {'SET' if os.getenv('FREELANCER_PASSWORD') else 'NOT SET'}")
          print(f"🌐 IMAP Host: {os.getenv('IMAP_HOST', 'imap.gmail.com')}")
          print(f"🔌 IMAP Port: {os.getenv('IMAP_PORT', '993')}")
          
          try:
              imap = imaplib.IMAP4_SSL(
                  os.getenv('IMAP_HOST', 'imap.gmail.com'),
                  int(os.getenv('IMAP_PORT', 993))
              )
              imap.login(
                  os.getenv('FREELANCER_EMAIL', ''),
                  os.getenv('FREELANCER_PASSWORD', '')
              )
              print("✅ Gmail authentication successful!")
              
              # Test inbox access
              imap.select('INBOX')
              status, messages = imap.search(None, 'ALL')
              total_emails = len(messages[0].split()) if status == 'OK' else 0
              print(f"📬 Total emails in inbox: {total_emails}")
              
              imap.logout()
          except imaplib.IMAP4.error as e:
              print(f"❌ Gmail authentication failed: {e}")
              print("\n💡 Troubleshooting tips:")
              print("   1. Use Gmail App Password (not regular password)")
              print("   2. Enable IMAP in Gmail settings")
              print("   3. Check if 2FA is enabled (requires App Password)")
              print("   4. Verify FREELANCER_PASSWORD secret is set correctly")
              sys.exit(1)
          except Exception as e:
              print(f"❌ Connection error: {e}")
              sys.exit(1)
          EOF
        env:
          FREELANCER_EMAIL: ${{ secrets.FREELANCER_EMAIL }}
          FREELANCER_PASSWORD: ${{ secrets.FREELANCER_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
      
      - name: Configure Keywords
        id: config
        run: |
          KEYWORDS="${{ github.event.inputs.keywords }}"
          if [ -z "$KEYWORDS" ]; then
            KEYWORDS="python,automation,web scraping,api,machine learning,data science"
          fi
          echo "keywords=$KEYWORDS" >> $GITHUB_OUTPUT
          
          DAYS="${{ github.event.inputs.days_back }}"
          if [ -z "$DAYS" ]; then
            DAYS="7"
          fi
          echo "days_back=$DAYS" >> $GITHUB_OUTPUT
          
          DEBUG="${{ github.event.inputs.debug }}"
          if [ -z "$DEBUG" ]; then
            DEBUG="true"
          fi
          echo "debug=$DEBUG" >> $GITHUB_OUTPUT
      
      - name: Run Freelancer Opportunity Finder
        id: finder
        run: |
          echo "🎯 Finding freelance opportunities..."
          
          # Convert comma-separated keywords to space-separated
          KEYWORDS=$(echo "${{ steps.config.outputs.keywords }}" | tr ',' ' ')
          
          # Build command with optional debug flag
          CMD="python .github/scripts/freelancer_finder.py \
            --days-back ${{ steps.config.outputs.days_back }} \
            --keywords $KEYWORDS \
            --output opportunities.json"
          
          if [ "${{ steps.config.outputs.debug }}" = "true" ]; then
            CMD="$CMD --debug"
          fi
          
          if [ "${{ github.event.inputs.skip_email }}" = "true" ]; then
            CMD="$CMD --skip-email"
          fi
          
          # Run the finder
          eval $CMD
          
          # Extract statistics with better error handling
          if [ -f opportunities.json ]; then
            echo "📄 Checking JSON structure..."
            python3 -c "import json; print(json.dumps(list(json.load(open('opportunities.json')).keys()), indent=2))"
            
            # Try to extract stats, but handle missing keys gracefully
            python3 << 'PYEOF' >> $GITHUB_OUTPUT
          import json
          import sys
          
          try:
              with open('opportunities.json', 'r') as f:
                  data = json.load(f)
              
              # Check if 'analysis' key exists
              if 'analysis' in data:
                  analysis = data['analysis']
                  total = analysis.get('total_opportunities', 0)
                  matched = analysis.get('matched_opportunities', 0)
                  models = len(analysis.get('business_models', []))
              else:
                  # Fallback: try to count from opportunities list
                  total = len(data.get('opportunities', []))
                  matched = len([j for j in data.get('opportunities', []) if j.get('match_score', 0) > 0])
                  models = 0
              
              print(f"total_opportunities={total}")
              print(f"matched_opportunities={matched}")
              print(f"business_models={models}")
              
              print(f"\n✅ Found {total} opportunities, {matched} matched, {models} business models", file=sys.stderr)
          except Exception as e:
              print(f"⚠️  Error parsing JSON: {e}", file=sys.stderr)
              print("total_opportunities=0")
              print("matched_opportunities=0")
              print("business_models=0")
          PYEOF
          else
            echo "⚠️  opportunities.json not created"
            echo "total_opportunities=0" >> $GITHUB_OUTPUT
            echo "matched_opportunities=0" >> $GITHUB_OUTPUT
            echo "business_models=0" >> $GITHUB_OUTPUT
          fi
        env:
          FREELANCER_EMAIL: ${{ secrets.FREELANCER_EMAIL }}
          FREELANCER_PASSWORD: ${{ secrets.FREELANCER_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
      
      - name: Generate Summary Report
        if: always()
        run: |
          echo "📊 Generating summary report..."
          
          python3 << 'EOF'
          import json
          import os
          
          try:
              with open('opportunities.json', 'r') as f:
                  data = json.load(f)
              
              # Handle both with and without 'analysis' key
              if 'analysis' in data:
                  analysis = data['analysis']
                  opportunities = data.get('opportunities', [])
              else:
                  # Create minimal analysis from opportunities
                  opportunities = data.get('opportunities', [])
                  analysis = {
                      'total_opportunities': len(opportunities),
                      'matched_opportunities': len([j for j in opportunities if j.get('match_score', 0) > 0]),
                      'business_models': [],
                      'top_skills_in_demand': [],
                      'platform_distribution': {},
                      'matched_jobs': [j for j in opportunities if j.get('match_score', 0) > 0]
                  }
              
              print("\n" + "="*80)
              print("FREELANCER OPPORTUNITY FINDER - SUMMARY")
              print("="*80)
              print(f"\n📊 Statistics:")
              print(f"   Total Opportunities: {analysis.get('total_opportunities', 0)}")
              print(f"   Matched Opportunities: {analysis.get('matched_opportunities', 0)}")
              print(f"   Business Models Found: {len(analysis.get('business_models', []))}")
              
              # Business Models
              if analysis.get('business_models'):
                  print(f"\n💼 Business Model Opportunities:")
                  for i, model in enumerate(analysis['business_models'][:5], 1):
                      print(f"   {i}. {model['name']} ({model['count']} opportunities)")
                      print(f"      {model['description']}")
              
              # Top Skills
              if analysis.get('top_skills_in_demand'):
                  print(f"\n🔥 Skills Most in Demand:")
                  for skill, count in analysis['top_skills_in_demand'][:10]:
                      print(f"   • {skill}: {count} mentions")
              
              # Platform Distribution
              if analysis.get('platform_distribution'):
                  print(f"\n📍 Platform Distribution:")
                  for platform, count in analysis['platform_distribution'].items():
                      print(f"   • {platform}: {count} opportunities")
              
              # Top Matches
              matched_jobs = analysis.get('matched_jobs', [])
              if matched_jobs:
                  print(f"\n🎯 Top 5 Matched Opportunities:")
                  for i, job in enumerate(matched_jobs[:5], 1):
                      print(f"\n   {i}. {job.get('title', 'Untitled')[:70]}")
                      print(f"      Match Score: {job.get('match_score', 0)}%")
                      print(f"      Platform: {job.get('platform', 'unknown').upper()}")
                      skills = job.get('matching_skills', [])
                      if skills:
                          print(f"      Skills: {', '.join(skills[:5])}")
                      if job.get('url'):
                          print(f"      URL: {job['url']}")
              else:
                  print(f"\n⚠️  No matched opportunities found")
              
              print("\n" + "="*80)
              
          except FileNotFoundError:
              print("❌ opportunities.json not found - no data to report")
          except Exception as e:
              print(f"❌ Error generating report: {e}")
              import traceback
              traceback.print_exc()
          EOF
      
      - name: Upload Opportunities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freelance-opportunities
          path: |
            opportunities.json
            *.log
          retention-days: 30
      
      - name: Create Business Model Report
        if: success()
        run: |
          echo "📋 Creating business model report..."
          
          python3 << 'EOF'
          import json
          from datetime import datetime
          
          try:
              with open('opportunities.json', 'r') as f:
                  data = json.load(f)
              
              # Handle both structures
              if 'analysis' in data:
                  analysis = data['analysis']
              else:
                  opportunities = data.get('opportunities', [])
                  analysis = {
                      'total_opportunities': len(opportunities),
                      'matched_opportunities': len([j for j in opportunities if j.get('match_score', 0) > 0]),
                      'business_models': [],
                      'top_skills_in_demand': []
                  }
              
              timestamp = data.get('generated_at', datetime.now().isoformat())
              
              # Create markdown report
              report = f"""# Business Model Opportunities Report
              
              Generated: {timestamp}

              ## Summary

              - **Total Opportunities Analyzed:** {analysis.get('total_opportunities', 0)}
              - **Matched to Your Skills:** {analysis.get('matched_opportunities', 0)}
              - **Business Models Identified:** {len(analysis.get('business_models', []))}
              
              """
              
              business_models = analysis.get('business_models', [])
              if business_models:
                  report += "## 💼 Business Models You Can Offer as Services\n\n"
                  report += "These are recurring patterns in the marketplace that you could turn into standardized service offerings:\n\n"
                  
                  for i, model in enumerate(business_models, 1):
                      report += f"""### {i}. {model['name']}

                      **Description:** {model['description']}

                      **Market Demand:** {model['count']} opportunities found  
                      **Average Match Score:** {model.get('avg_score', 0)}%

                      **Example Projects:**
                      """
                      for example in model.get('examples', []):
                          report += f"- [{example['title']}]({example.get('url', '#')}) (Score: {example.get('score', 0)}%)\n"
                      
                      report += """
                      **Potential Service Offering:**
                      - Create standardized packages (Basic, Standard, Premium)
                      - Develop reusable templates and frameworks
                      - Offer subscription-based services
                      - Build productized consulting

                      ---

                      """
              else:
                  report += "## 💼 No Business Models Identified Yet\n\n"
                  report += "Run the finder with more opportunities to identify patterns.\n\n"
              
              # Add skills section
              skills = analysis.get('top_skills_in_demand', [])
              if skills:
                  report += "## 🔥 Skills Most in Demand\n\n"
                  for skill, count in skills[:15]:
                      report += f"- **{skill}**: {count} mentions\n"
              
              # Save report
              with open('business_model_report.md', 'w') as f:
                  f.write(report)
              
              print("✅ Business model report created: business_model_report.md")
              
          except Exception as e:
              print(f"❌ Error creating report: {e}")
              import traceback
              traceback.print_exc()
          EOF
      
      - name: Upload Business Model Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: business-model-report
          path: business_model_report.md
          retention-days: 90
      
      - name: Update README with Latest Stats
        if: github.event_name == 'schedule'
        run: |
          echo "📝 Updating README with latest statistics..."
          
          python3 << 'EOF'
          import json
          from datetime import datetime
          
          try:
              with open('opportunities.json', 'r') as f:
                  data = json.load(f)
              
              # Handle both structures
              if 'analysis' in data:
                  analysis = data['analysis']
              else:
                  opportunities = data.get('opportunities', [])
                  analysis = {
                      'total_opportunities': len(opportunities),
                      'matched_opportunities': len([j for j in opportunities if j.get('match_score', 0) > 0]),
                      'business_models': []
                  }
              
              # Create stats badge section
              stats = f"""## 📊 Latest Scan Results

              **Last Updated:** {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}

              - 🎯 **Opportunities Found:** {analysis.get('total_opportunities', 0)}
              - ✅ **Matched to Profile:** {analysis.get('matched_opportunities', 0)}
              - 💼 **Business Models:** {len(analysis.get('business_models', []))}

              """
              
              business_models = analysis.get('business_models', [])
              if business_models:
                  stats += "### Top Business Opportunities\n\n"
                  for i, model in enumerate(business_models[:3], 1):
                      stats += f"{i}. **{model['name']}** - {model['count']} opportunities\n"
              
              print(stats)
              
              # Update README if it exists
              try:
                  with open('README.md', 'r') as f:
                      readme = f.read()
                  
                  # Replace stats section or append
                  if '## 📊 Latest Scan Results' in readme:
                      start = readme.find('## 📊 Latest Scan Results')
                      end = readme.find('\n## ', start + 1)
                      if end == -1:
                          end = len(readme)
                      readme = readme[:start] + stats + readme[end:]
                  else:
                      readme += '\n\n' + stats
                  
                  with open('README.md', 'w') as f:
                      f.write(readme)
                  
                  print("✅ README.md updated")
              except FileNotFoundError:
                  print("ℹ️  README.md not found, skipping update")
              
          except Exception as e:
              print(f"❌ Error updating README: {e}")
          EOF
      
      - name: Commit Updated Stats
        if: github.event_name == 'schedule'
        run: |
          git config user.name "🤖 Freelancer Bot"
          git config user.email "bot@freelancer-finder.local"
          
          git add README.md 2>/dev/null || true
          
          if git diff-index --quiet HEAD --; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "🤖 Update freelancer stats

            - Opportunities: ${{ steps.finder.outputs.total_opportunities }}
            - Matched: ${{ steps.finder.outputs.matched_opportunities }}
            - Business Models: ${{ steps.finder.outputs.business_models }}
            - Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            
            git push origin HEAD || echo "⚠️  Could not push changes"
          fi
      
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Freelancer Finder Failed',
              body: `# Freelancer Opportunity Finder Failure\n\n**Run ID:** ${{ github.run_id }}\n**Timestamp:** ${new Date().toISOString()}\n\n[View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'automation']
            })
      
      - name: Summary
        if: always()
        run: |
          echo "### 🎯 Freelancer Opportunity Finder Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Opportunities:** ${{ steps.finder.outputs.total_opportunities }}" >> $GITHUB_STEP_SUMMARY
          echo "**Matched Opportunities:** ${{ steps.finder.outputs.matched_opportunities }}" >> $GITHUB_STEP_SUMMARY
          echo "**Business Models:** ${{ steps.finder.outputs.business_models }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the [opportunities.json](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) artifact for full details." >> $GITHUB_STEP_SUMMARY
